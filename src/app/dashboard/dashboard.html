<div class="dashboard-container">
  <button routerLink="/" class="btn-back">⬅ Torna alla Home</button>

  <div class="add-line-container">
    <input
      type="text"
      [(ngModel)]="newLineName"
      placeholder="Esempio: z228, 423..."
      (keyup.enter)="addNewLine()"
    />
    <button (click)="addNewLine()" [disabled]="!newLineName.trim()">
      ➕ Aggiungi Nuova Linea
    </button>
  </div>

  <h1>Le Tue Linee Autobus</h1>
  <p>Seleziona una Linea da gestire</p>

  <div class="lines-grid">
    @for (line of allLines; track line.id) {
      <div class="line-card" [routerLink]="['/line', line.id]">

        <button class="btn-delete" (click)="removeLine($event, line.id)" title="Elimina linea">
          &times;
        </button>

        <div class="card-header">
          <span class="line-badge">Bus</span>
          <h2>{{ line.name }}</h2>
        </div>
        <p>{{ line.stopCount }} fermate totali</p>
        <div class="card-footer">
          <span>Gestisci Percorso →</span>
        </div>
      </div>
    }
  </div>
</div>
